name: Build OllierStore APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OllierStore_APK_V88.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Extraire le projet APK
        run: |
          unzip -q OllierStore_APK_V88.zip
          ls -la
          ls -la OllierStore_APK_V88

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        working-directory: OllierStore_APK_V88
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: OllierStore-V88-APK
          path: OllierStore_APK_V88/app/build/outputs/apk/debug/app-debug.apk
